name: Task
description: Work to do, with the way to tell it is done
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What changes and why.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: The check that proves it, seen working on the real path.
    validations:
      required: true
