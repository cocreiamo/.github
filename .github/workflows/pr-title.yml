# Reusable: the PR title becomes the squash commit on main, so it must be a Conventional Commit. `test` is allowed: a
# pull request that only adds a test (test-first, a contract test) is a `test:` change. Callers:
#   on: {pull_request: {types: [opened, edited, synchronize, reopened]}}
#   jobs: {title: {permissions: {pull-requests: read}, uses: cocreiamo/.github/.github/workflows/pr-title.yml@<sha>}}
name: pr-title
on:
  workflow_call: {}
permissions: {}
jobs:
  check:
    runs-on: [self-hosted, cocreiamo-ci-light]
    timeout-minutes: 2
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            perf
            build
            ci
            chore
            style
            test
            revert
          scopes: |
            [a-z0-9._/-]+
          requireScope: false
          subjectPattern: ^[^ ].{2,}$
          subjectPatternError: the subject must name the change (at least 3 characters, no leading space)
