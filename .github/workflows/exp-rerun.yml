name: exp-rerun
on:
  push:
    branches: [fix/revert-first-red]
permissions: {}
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
  b:
    needs: [a]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: |
          sleep 20
          curl -s -o /dev/stderr -w '%{http_code}\n' -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/rerun-failed-jobs"
        env:
          GH_TOKEN: ${{ github.token }}
