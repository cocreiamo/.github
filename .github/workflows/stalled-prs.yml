# Reusable: one issue «stalled pull requests» in the calling repository lists the pull requests open for more than 6 hours that make
# no progress (conflict, red check, no check, auto-merge off, green but not merging). The issue is updated, never duplicated, and closes
# when nothing stalls; GitHub mails the founder on a new one. The script is shared/scripts/stalled_prs.py, embedded below by
# tools/embed-scripts.sh (a caller's token cannot read this private repository). A light slot is for read-only jobs: this one writes
# an issue. A caller adds:
#   on: {schedule: [{cron: "47 4 * * *"}], workflow_dispatch: {}}
#   permissions: {}
#   jobs:
#     stalled:
#       permissions: {contents: read, issues: write, pull-requests: read, checks: read, actions: read}
#       uses: cocreiamo/.github/.github/workflows/stalled-prs.yml@<sha>
#       with: {cleanup: false, alert: true}
#       secrets: {app-private-key: "${{ secrets.CLAUDE_CODE_PR_APP_PRIVATE_KEY }}"}
# cleanup: true first empties the runner workspace (files a root container left behind need root to go: falls back to Docker).
# alert: true (default) raises «main is red: stalled failed» through post-merge-alert.yml when the run fails; it needs the secret
# app-private-key, the variable CLAUDE_CODE_PR_APP_ID of the caller and actions: read.
name: stalled-prs
on:
  workflow_call:
    inputs:
      cleanup:
        description: empty the runner workspace before the run
        type: boolean
        default: false
      alert:
        description: raise an issue when the run fails
        type: boolean
        default: true
    secrets:
      app-private-key:
        required: false
permissions: {}
jobs:
  stalled:
    runs-on: [self-hosted, cocreiamo-ci]
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: read
      checks: read
    steps:
      - name: empty the workspace
        if: ${{ inputs.cleanup }}
        run: |
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} + 2>/dev/null ||
            docker run --rm -v "$GITHUB_WORKSPACE:/w" registry.cocreiamo.com/dockerhub/library/busybox:1.37@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec find /w -mindepth 1 -maxdepth 1 -exec rm -rf {} +
      - name: list the stalled pull requests
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SCRIPT: |
            #!/usr/bin/env python3
            """List the pull requests open for more than STALLED_AFTER_HOURS that make no progress, in one issue per repository.

            A pull request is stalled when it is not a draft and: it conflicts with main, a check is red, no check ran, auto-merge is
            off, or every check is green and it still does not merge. A running check is progress.

            usage: stalled_prs.py    (env GITHUB_TOKEN, GITHUB_REPOSITORY)
            """

            import datetime as dt
            import json
            import os
            import urllib.request

            STALLED_AFTER_HOURS = 6
            LABEL = "stalled-prs"
            RED = {"failure", "timed_out", "cancelled", "action_required", "startup_failure"}


            def latest(checks):
                by_name = {}
                for c in checks:
                    if c["name"] not in by_name or c["id"] > by_name[c["name"]]["id"]:
                        by_name[c["name"]] = c
                return list(by_name.values())


            def reason(pull, checks):
                checks = latest(checks)
                if pull.get("mergeable_state") == "dirty":
                    return "conflict with main"
                red = sorted(c["name"] for c in checks if c.get("conclusion") in RED)
                if red:
                    return "red check: " + ", ".join(red)
                if not checks:
                    return "no check ran"
                if any(c.get("status") != "completed" for c in checks):
                    return None
                if not pull.get("auto_merge"):
                    return "auto-merge is off: nobody has merged it"
                if pull.get("mergeable_state") in ("blocked", "behind", "unstable"):
                    return f"every check is green but it does not merge ({pull['mergeable_state']})"
                return None


            def stalled(pulls, checks_of, now):
                found = []
                for pull in pulls:
                    created = dt.datetime.strptime(pull["created_at"], "%Y-%m-%dT%H:%M:%SZ").replace(tzinfo=dt.UTC)
                    age = (now - created).total_seconds() / 3600
                    if pull.get("draft") or age <= STALLED_AFTER_HOURS:
                        continue
                    why = reason(pull, checks_of(pull))
                    if why:
                        found.append(
                            {"number": pull["number"], "title": pull["title"], "url": pull["html_url"], "age_hours": round(age), "reason": why}
                        )
                return sorted(found, key=lambda f: -f["age_hours"])


            def body_of(found, now):
                lines = [
                    f"Pull requests open for more than {STALLED_AFTER_HOURS} hours that make no progress ({now:%Y-%m-%d %H:%M} UTC).",
                    "Drive each to merged or closed with a written reason.",
                    "",
                ]
                lines += [f"- #{f['number']} {f['title']} ({f['age_hours']} h): {f['reason']} {f['url']}" for f in found]
                return "\n".join(lines)


            def sync_issue(api, repo, found, now):
                open_issue = (api("GET", f"/repos/{repo}/issues?state=open&labels={LABEL}") or [None])[0]
                if not found:
                    if open_issue:
                        api("PATCH", f"/repos/{repo}/issues/{open_issue['number']}", {"state": "closed"})
                    return
                body = body_of(found, now)
                if open_issue:
                    api("PATCH", f"/repos/{repo}/issues/{open_issue['number']}", {"body": body})
                else:
                    api("POST", f"/repos/{repo}/issues", {"title": "stalled pull requests", "labels": [LABEL], "body": body})


            def main():
                token = os.environ["GITHUB_TOKEN"]
                repo = os.environ["GITHUB_REPOSITORY"]

                def api(method, path, body=None):
                    req = urllib.request.Request(
                        "https://api.github.com" + path,
                        data=json.dumps(body).encode() if body is not None else None,
                        method=method,
                        headers={"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"},
                    )
                    with urllib.request.urlopen(req, timeout=30) as r:
                        return json.load(r)

                def detail(number):
                    return api("GET", f"/repos/{repo}/pulls/{number}")

                def checks_of(pull):
                    return api("GET", f"/repos/{repo}/commits/{pull['head']['sha']}/check-runs?per_page=100")["check_runs"]

                now = dt.datetime.now(dt.UTC)
                listed = api("GET", f"/repos/{repo}/pulls?state=open&per_page=100")
                old = [
                    p
                    for p in listed
                    if (now - dt.datetime.strptime(p["created_at"], "%Y-%m-%dT%H:%M:%SZ").replace(tzinfo=dt.UTC)).total_seconds()
                    > STALLED_AFTER_HOURS * 3600
                ]
                found = stalled([detail(p["number"]) for p in old], checks_of, now)
                sync_issue(api, repo, found, now)
                print(f"{len(found)} stalled pull request(s) of {len(listed)} open")


            if __name__ == "__main__":
                main()
        run: python3 -I -c "$SCRIPT"
  alert:
    needs: [stalled]
    if: ${{ always() && inputs.alert && needs.stalled.result == 'failure' }}
    permissions:
      actions: read
    uses: cocreiamo/.github/.github/workflows/post-merge-alert.yml@4bc3730d445176c5c10c8868338e2cfc0235d653 # main
    with:
      failed: "stalled"
      app-id: ${{ vars.CLAUDE_CODE_PR_APP_ID }}
    secrets:
      app-private-key: ${{ secrets.app-private-key }}
