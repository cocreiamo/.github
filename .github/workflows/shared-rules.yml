        run: |
          set -euo pipefail
          dir=$(mktemp -d); trap 'rm -rf "$dir"' EXIT
          base64 -d <<<"$RULES_BUNDLE" | tar -xzf - -C "$dir"
          status=0
          python3 -I "$dir/claude-md-duplicates" check "${REPO#*/}" CLAUDE.md "$dir/claude-md-paragraphs" || status=1
          [ "$EVENT" = pull_request ] || exit "$status"
          python3 -I - "$dir" <<'PY'
          import json, os, sys, urllib.request
          url = f"https://api.github.com/repos/{os.environ['REPO']}/compare/{os.environ['BASE_SHA']}...{os.environ['HEAD_SHA']}?per_page=1"
          req = urllib.request.Request(url, headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"})
          with urllib.request.urlopen(req, timeout=30) as r:
              files = json.load(r).get("files", [])
          with open(sys.argv[1] + "/numstat", "w") as f:
              f.writelines(f"{x['additions']}\t{x['deletions']}\t{x['filename']}\n" for x in files)
          with open(sys.argv[1] + "/diff", "w") as f:
              f.writelines(f"--- a/{x['filename']}\n+++ b/{x['filename']}\n{x['patch']}\n" for x in files if x.get("patch"))
          PY
          "$dir/pr-size" --numstat "$dir/numstat" || status=1
          python3 -I "$dir/comment-hygiene" --diff "$dir/diff" . || status=1
          exit "$status"
      - name: fetch the vendored scripts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ -f .github/shared-scripts ] || [ -f .github/shared-configs ] || exit 0
          git sparse-checkout list >/dev/null 2>&1 || exit 0
          # the checkout leaves no credentials behind and a sparse checkout is a partial clone: the blobs come from the remote
          if [ -n "${GH_TOKEN:-}" ]; then
            auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
            echo "::add-mask::$auth"
            export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          fi
          for manifest in .github/shared-scripts .github/shared-configs; do
            [ -f "$manifest" ] || continue
            awk '$1 !~ /^#/ && NF >= 2 && $2 !~ /(^|\/)\.\.(\/|$)/ && $2 !~ /^\// { print "/" $2 }' "$manifest"
          done | git sparse-checkout add --stdin
