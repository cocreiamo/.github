        run: |
          set -euo pipefail
          manifest=.github/shared-configs
          [ -f "$manifest" ] || { echo "ok: no $manifest, this repository vendors no shared config"; exit 0; }
          canon=$(mktemp -d); trap 'rm -rf "$canon"' EXIT
          base64 -d <<<"$CONFIGS_BUNDLE" | tar -xzf - -C "$canon"
          status=0 count=0
          while read -r name path extra; do
            case ${name:-} in ''|'#'*) continue ;; esac
            if [ -z "${path:-}" ] || [ -n "${extra:-}" ] || ! [[ $name =~ ^[A-Za-z0-9._/-]+$ ]]; then
              echo "::error file=$manifest::malformed line (want 'canonical-name local-path'): $name ${path:-} ${extra:-}"; status=1; continue
            fi
            case $name in /*|..|../*|*/..|*/../*) echo "::error file=$manifest::$name leaves shared/config"; status=1; continue ;; esac
            case $path in /*|..|../*|*/..|*/../*) echo "::error file=$manifest::$path leaves the repository"; status=1; continue ;; esac
            count=$((count + 1))
            if [ ! -f "$canon/$name" ]; then echo "::error file=$manifest::$name is not a canonical config of cocreiamo/.github at the pinned commit"; status=1; continue; fi
            if [ ! -f "$path" ] || [ -L "$path" ]; then echo "::error file=$manifest::$path is missing (or a link): it must be a copy of the canonical $name"; status=1; continue; fi
            if ! diff -u --label "canonical $name" --label "$path" "$canon/$name" "$path"; then
              echo "::error file=$path::differs from the canonical $name of cocreiamo/.github at the pinned commit (- canonical, + here): change it there and bump the pin, or restore the text"; status=1
            fi
          done < "$manifest"
          [ "$count" -gt 0 ] || { echo "::error file=$manifest::declares no config"; status=1; }
          [ "$status" -eq 0 ] && echo "ok: $count vendored configs are the canonical ones"
          exit "$status"
