        run: |
          set -euo pipefail
          manifest=.github/shared-scripts
          [ -f "$manifest" ] || { echo "::error::no $manifest: it lists 'canonical-name local-path' for each script this repository vendors from shared/scripts of cocreiamo/.github"; exit 1; }
          canon=$(mktemp -d); trap 'rm -rf "$canon"' EXIT
          base64 -d <<<"$SCRIPTS_BUNDLE" | tar -xzf - -C "$canon"
          status=0 count=0
          while read -r name path extra; do
            case ${name:-} in ''|'#'*) continue ;; esac
            if [ -z "${path:-}" ] || [ -n "${extra:-}" ] || ! [[ $name =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "::error file=$manifest::malformed line (want 'canonical-name local-path'): $name ${path:-} ${extra:-}"; status=1; continue
            fi
            case $path in /*|..|../*|*/..|*/../*) echo "::error file=$manifest::$path leaves the repository"; status=1; continue ;; esac
            count=$((count + 1))
            if [ ! -f "$canon/$name" ]; then echo "::error file=$manifest::$name is not a canonical script of cocreiamo/.github at the pinned commit"; status=1; continue; fi
            if [ ! -f "$path" ] || [ -L "$path" ]; then echo "::error file=$manifest::$path is missing (or a link): it must be a copy of the canonical $name"; status=1; continue; fi
            if ! diff -u --label "canonical $name" --label "$path" "$canon/$name" "$path"; then
              echo "::error file=$path::differs from the canonical $name of cocreiamo/.github at the pinned commit (- canonical, + here): change it there and bump the pin, or restore the text"; status=1
            fi
            if [ "$(test -x "$canon/$name" && echo x)" != "$(test -x "$path" && echo x)" ]; then
              echo "::error file=$path::the executable bit differs from the canonical $name"; status=1
            fi
          done < "$manifest"
          [ "$count" -gt 0 ] || { echo "::error file=$manifest::declares no script"; status=1; }
          [ "$status" -eq 0 ] && echo "ok: $count vendored scripts are the canonical ones"
          exit "$status"
