        run: |
          set -euo pipefail
          manifest=.github/shared-scripts
          [ -f "$manifest" ] || { echo "::error::no $manifest: it lists 'canonical-name local-path' for each script this repository vendors from shared/scripts of cocreiamo/.github"; exit 1; }
          canon=$(mktemp -d); trap 'rm -rf "$canon"' EXIT
          base64 -d <<<"$SCRIPTS_BUNDLE" | tar -xzf - -C "$canon"
          status=0 count=0
          while read -r name path extra; do
            case ${name:-} in ''|'#'*) continue ;; esac
            if [ -z "${path:-}" ] || [ -n "${extra:-}" ] || ! [[ $name =~ ^[A-Za-z0-9._-]+$ ]]; then
