# Reusable: after a merge to main, when a required job of the repository's own check workflow failed on the merge commit,
# open a revert PR (auto-merge on) and raise an alert issue assigned to the founder. A caller adds one job to the workflow
# that runs the required checks on pull_request and on push to main:
#   post-merge:
#     needs: [<the required jobs>]
#     if: ${{ always() && github.event_name == 'push' && contains(needs.*.result, 'failure') }}
#     permissions: {actions: read}
#     uses: cocreiamo/.github/.github/workflows/post-merge-revert.yml@<sha>
#     with: {failed: "<names of the jobs>", app-id: "${{ vars.CLAUDE_CODE_PR_APP_ID }}"}
#     secrets: {app-private-key: "${{ secrets.CLAUDE_CODE_PR_APP_PRIVATE_KEY }}"}
# The runs are read with the run's own token (actions: read, as post-merge-alert.yml does): the App has no Actions permission. A failure anywhere in the
# decision raises the alert and fails the job, so a red main is never silent.
# No gh binary on the runner: plain HTTPS to the API. The revert is GitHub's own revertPullRequest mutation, made by the App cocreiamo-claude-code-pr. Never reverted: a
# revert, a PR of any bot (Renovate included), a commit with no PR, a commit main has already moved past (unless the caller passes moved-ok), a commit whose
# revert is already open, a commit after which a later run of the same workflow on main succeeded (main is green again); the first three still raise the alert. dry-run does everything except write.
name: post-merge-revert
on:
  workflow_call:
    inputs:
      failed:
        description: names of the failed required jobs, for the alert
        type: string
        required: true
      app-id:
        type: string
        required: true
      sha:
        description: commit to judge, default the commit of the run
        type: string
        default: ""
      dry-run:
        type: boolean
        default: false
      moved-ok:
        description: judge a commit main has moved past (live verification, where no newer run would blame it)
        type: boolean
        default: false
      assignee:
        type: string
        default: iambilotta
    secrets:
      app-private-key:
        required: true
permissions: {}
jobs:
  revert:
    runs-on: [self-hosted, cocreiamo-ci]
    timeout-minutes: 10
    permissions:
      actions: read
    steps:
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ inputs.app-id }}
          private-key: ${{ secrets.app-private-key }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - name: decide and act
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          READ_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ inputs.sha || github.sha }}
          FAILED: ${{ inputs.failed }}
          ASSIGNEE: ${{ inputs.assignee }}
          DRY_RUN: ${{ inputs.dry-run }}
          MOVED_OK: ${{ inputs.moved-ok }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SCRIPT: |
            import json, os, re, sys, urllib.error, urllib.request

            API = os.environ.get("API_URL", "https://api.github.com")

            def call(method, path, body=None, token="GH_TOKEN"):
                req = urllib.request.Request(API + path, method=method, data=None if body is None else json.dumps(body).encode(), headers={
                    "Authorization": "Bearer " + os.environ[token], "Accept": "application/vnd.github+json", "Content-Type": "application/json"})
                try:
                    with urllib.request.urlopen(req, timeout=30) as r:
                        raw = r.read()
                except urllib.error.HTTPError as e:
                    raise RuntimeError("%s %s: %s %s" % (method, path, e.code, e.read()[:200].decode(errors="replace")))
                return json.loads(raw) if raw else None

            def api(path, token="GH_TOKEN"):
                return call("GET", path, token=token)

            def graphql(query, variables):
                out = call("POST", "/graphql", {"query": query, "variables": variables})
                if out.get("errors"):
                    raise RuntimeError("graphql: %s" % json.dumps(out["errors"])[:300])
                return out["data"]

            def decide(f):
                if f.get("green_after"):
                    return {"action": "skip", "reason": "main is green again: a later run of the same workflow succeeded after this commit"}
                if f["head_sha"] != f["sha"] and not f["moved_ok"]:
                    return {"action": "skip", "reason": "main has moved on: the run of the newer commit decides"}
                if f["open_revert"]:
                    return {"action": "skip", "reason": "a revert of this commit is already open"}
                pr = f["pr"]
                title = f["commit_title"].lower()
                if title.startswith("revert") or (pr and (pr["head_ref"].startswith("revert") or pr["title"].lower().startswith("revert"))):
                    return {"action": "alert", "reason": "a revert is never reverted: a human looks"}
                if pr is None:
                    return {"action": "alert", "reason": "no pull request behind the commit: nothing to revert"}
                if pr["author"].endswith("[bot]") or pr["head_ref"].startswith("renovate/"):
                    return {"action": "alert", "reason": "a bot PR is never reverted automatically"}
                return {"action": "revert", "reason": "the merge commit is the head of main and its PR is a human one"}

            def green_after(repo, run_url):
                # A later green run on main means the red was fixed or transient: a revert now would undo good work.
                m = re.search(r"/actions/runs/([0-9]+)", run_url or "")
                if not m:
                    return False
                try:
                    this = api("/repos/%s/actions/runs/%s" % (repo, m.group(1)), "READ_TOKEN")
                    runs = api("/repos/%s/actions/workflows/%s/runs?branch=main&event=push&status=completed&per_page=30" % (repo, this["workflow_id"]), "READ_TOKEN")["workflow_runs"]
                except RuntimeError as e:
                    print("runs unreadable, main is not assumed green: %s" % e, file=sys.stderr)
                    return False
                return any(r["conclusion"] == "success" and r["created_at"] > this["created_at"] for r in runs)

            def gather(repo, sha, run_url=""):
                head = api("/repos/%s/git/ref/heads/main" % repo)["object"]["sha"]
                title = api("/repos/%s/commits/%s" % (repo, sha))["commit"]["message"].split("\n")[0]
                merged = [p for p in api("/repos/%s/commits/%s/pulls" % (repo, sha)) if p.get("merged_at") and p.get("merge_commit_sha") == sha]
                pr = None
                if merged:
                    p = merged[0]
                    pr = {"number": p["number"], "title": p["title"], "head_ref": p["head"]["ref"], "author": p["user"]["login"], "node_id": p["node_id"]}
                marker = "<!-- post-merge-revert:%s -->" % sha
                opened = api("/repos/%s/pulls?state=open&per_page=100" % repo)
                return {"sha": sha, "head_sha": head, "commit_title": title, "pr": pr, "moved_ok": os.environ.get("MOVED_OK") == "true", "open_revert": any(marker in (p.get("body") or "") for p in opened),
                        "green_after": green_after(repo, run_url)}

            def run(env):
                repo, sha, dry = env["REPO"], env["SHA"], env["DRY_RUN"] == "true"
                f = gather(repo, sha, env.get("RUN_URL", ""))
                d = decide(f)
                print("commit %s (%s): %s: %s" % (sha[:12], f["commit_title"], d["action"], d["reason"]))
                if d["action"] == "skip":
                    return 0
                pr = f["pr"]
                what = "PR #%d (%s)" % (pr["number"], pr["title"]) if pr else "commit %s" % sha[:12]
                issue_title = "main is red: %s" % f["commit_title"]
                issue_body = "\n".join([
                    "The required job(s) %s failed on the merge commit %s of %s on main: %s" % (env["FAILED"], sha, what, env["RUN_URL"]),
                    "", ("Revert: a PR with auto-merge is being opened." if d["action"] == "revert" else "No automatic revert: %s." % d["reason"]),
                ])
                if dry:
                    print("dry run, would raise the alert issue %r assigned to %s" % (issue_title, env["ASSIGNEE"]))
                    if d["action"] == "revert":
                        print("dry run, would revert %s as 'revert: %s' with auto-merge, and comment on #%d" % (what, pr["title"], pr["number"]))
                    return 0
                try:
                    call("POST", "/repos/%s/labels" % repo, {"name": "main-red", "color": "b60205"})
                except RuntimeError:
                    pass
                issue = call("POST", "/repos/%s/issues" % repo, {"title": issue_title, "body": issue_body, "labels": ["main-red"], "assignees": [env["ASSIGNEE"]]})
                print("alert issue #%d" % issue["number"])
                if d["action"] != "revert":
                    return 0
                body = "\n".join([
                    "Reverts #%d, merged as %s." % (pr["number"], sha),
                    "", "The required job(s) %s failed on the merge commit: %s" % (env["FAILED"], env["RUN_URL"]),
                    "", "Closes #%d" % issue["number"], "", "<!-- post-merge-revert:%s -->" % sha,
                ])
                try:
                    out = graphql("mutation($id:ID!,$title:String!,$body:String!){revertPullRequest(input:{pullRequestId:$id,title:$title,body:$body}){revertPullRequest{id number url}}}",
                                  {"id": pr["node_id"], "title": "revert: " + pr["title"], "body": body})
                    new = out["revertPullRequest"]["revertPullRequest"]
                    graphql("mutation($id:ID!){enablePullRequestAutoMerge(input:{pullRequestId:$id,mergeMethod:SQUASH}){clientMutationId}}", {"id": new["id"]})
                except (RuntimeError, KeyError, TypeError) as e:
                    call("POST", "/repos/%s/issues/%d/comments" % (repo, issue["number"]), {"body": "The automatic revert could not be made (%s): revert %s by hand." % (e, what)})
                    print("revert failed: %s" % e, file=sys.stderr)
                    return 1
                call("POST", "/repos/%s/issues/%d/comments" % (repo, pr["number"]),
                     {"body": "Red on main after this merge (%s: %s). Reverted by %s; alert #%d." % (env["FAILED"], env["RUN_URL"], new["url"], issue["number"])})
                print("revert PR #%d, auto-merge on" % new["number"])
                return 0

            def main(env):
                try:
                    return run(env)
                except Exception as e:
                    print("the decision failed: %s" % e, file=sys.stderr)
                    if env.get("DRY_RUN") == "true":
                        return 1
                    try:
                        call("POST", "/repos/%s/labels" % env["REPO"], {"name": "main-red", "color": "b60205"})
                    except Exception:
                        pass
                    call("POST", "/repos/%s/issues" % env["REPO"], {"title": "main is red: %s" % env["SHA"][:12], "labels": ["main-red"], "assignees": [env["ASSIGNEE"]], "body": "\n".join([
                        "The required job(s) %s failed on %s on main: %s" % (env["FAILED"], env["SHA"], env["RUN_URL"]),
                        "", "No automatic revert: the decision itself failed (%s). A human looks." % e])})
                    return 1

            if __name__ == "__main__":
                sys.exit(main(os.environ))
        run: python3 -I -c "$SCRIPT"
