name: check
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  title:
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    uses: ./.github/workflows/pr-title.yml # zizmor: ignore[self-repository]  the version under review is the one to run
  checks:
    runs-on: ${{ fromJSON(github.repository_visibility == 'public' && '"ubuntu-24.04"' || '["self-hosted","cocreiamo-ci"]') }}
    timeout-minutes: 10
    env:
      CI_BASE: ${{ github.event.pull_request.base.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: ci-mise-setup
        if: github.repository_visibility != 'public'
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        if: github.repository_visibility == 'public'
        with:
          cache: false
      - id: parts
        run: mise run ci -- affected --github-output
      - if: contains(fromJSON(steps.parts.outputs.parts), 'workflows')
        run: mise run ci -- workflows
      - if: contains(fromJSON(steps.parts.outputs.parts), 'lint')
        run: mise run ci -- lint
      - if: contains(fromJSON(steps.parts.outputs.parts), 'tests')
        run: mise run ci -- tests
  ci:
    needs: [title, checks]
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ${{ fromJSON(github.repository_visibility == 'public' && '"ubuntu-24.04"' || '["self-hosted","cocreiamo-ci-light"]') }}
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
