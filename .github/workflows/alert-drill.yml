# Drill of post-merge-alert.yml on a real run, every month (schedule) or on demand: one job fails on purpose, the alert
# opens an issue labelled drill, the verification reads it back through the API, the alert fires a second time and must
# comment on the same issue, the verification reads the comment, comments «drill passed» and closes the issue. The deliberate
# failure is continue-on-error, so a green drill run means the alert path works. Dispatch with expect=created or
# expect=commented runs one half only (commented needs the issue left open by created). A red scheduled drill raises
# «main is red: <job> failed» through the real alert, because nobody watches a scheduled run.
name: alert-drill
on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:
    inputs:
      expect:
        description: full runs the whole cycle; created or commented runs one half
        type: choice
        options: [full, created, commented]
        default: full
permissions: {}
jobs:
  drill-fail:
    runs-on: [self-hosted, cocreiamo-ci]
    timeout-minutes: 5
    continue-on-error: true
    permissions: {}
    steps:
      - run: |
          echo "Error: alert-drill marker ${GITHUB_RUN_ID}"
          exit 1
  alert-created:
    needs: [drill-fail]
    if: ${{ always() && (github.event_name == 'schedule' || inputs.expect != 'commented') }}
    permissions:
      actions: read
    uses: ./.github/workflows/post-merge-alert.yml # zizmor: ignore[self-repository]  the drill runs the version under test
    with:
      failed: drill-fail
      app-id: ${{ vars.CLAUDE_CODE_PR_APP_ID }}
      title-prefix: "drill: "
      label: drill
    secrets:
      app-private-key: ${{ secrets.CLAUDE_CODE_PR_APP_PRIVATE_KEY }}
  verify-created:
    needs: [drill-fail, alert-created]
    if: ${{ always() && needs.alert-created.result == 'success' && (github.event_name == 'schedule' || inputs.expect != 'commented') }}
    permissions:
      actions: read
    uses: ./.github/workflows/alert-drill-verify.yml # zizmor: ignore[self-repository]  the drill runs the version under test
    with:
      expect: created
      app-id: ${{ vars.CLAUDE_CODE_PR_APP_ID }}
    secrets:
      app-private-key: ${{ secrets.CLAUDE_CODE_PR_APP_PRIVATE_KEY }}
  alert-commented:
    needs: [drill-fail, verify-created]
    if: ${{ always() && (github.event_name == 'schedule' || inputs.expect != 'created') && (needs.verify-created.result == 'success' || inputs.expect == 'commented') }}
    permissions:
      actions: read
    uses: ./.github/workflows/post-merge-alert.yml # zizmor: ignore[self-repository]  the drill runs the version under test
    with:
      failed: drill-fail
      app-id: ${{ vars.CLAUDE_CODE_PR_APP_ID }}
      title-prefix: "drill: "
      label: drill
    secrets:
      app-private-key: ${{ secrets.CLAUDE_CODE_PR_APP_PRIVATE_KEY }}
  verify-commented:
    needs: [drill-fail, alert-commented]
    if: ${{ always() && needs.alert-commented.result == 'success' }}
    permissions:
      actions: read
    uses: ./.github/workflows/alert-drill-verify.yml # zizmor: ignore[self-repository]  the drill runs the version under test
    with:
      expect: commented
      app-id: ${{ vars.CLAUDE_CODE_PR_APP_ID }}
    secrets:
      app-private-key: ${{ secrets.CLAUDE_CODE_PR_APP_PRIVATE_KEY }}
  drill-red:
    needs: [drill-fail, alert-created, verify-created, alert-commented, verify-commented]
    if: ${{ always() && github.event_name == 'schedule' && contains(needs.*.result, 'failure') }}
    permissions:
      actions: read
    uses: ./.github/workflows/post-merge-alert.yml # zizmor: ignore[self-repository]  the drill runs the version under test
    with:
      failed: ${{ needs.alert-created.result == 'failure' && 'alert-created' || '' }} ${{ needs.verify-created.result == 'failure' && 'verify-created' || '' }} ${{ needs.alert-commented.result == 'failure' && 'alert-commented' || '' }} ${{ needs.verify-commented.result == 'failure' && 'verify-commented' || '' }}
      app-id: ${{ vars.CLAUDE_CODE_PR_APP_ID }}
    secrets:
      app-private-key: ${{ secrets.CLAUDE_CODE_PR_APP_PRIVATE_KEY }}
