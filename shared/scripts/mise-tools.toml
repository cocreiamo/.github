# The tool versions every cocreiamo repository pins the same: the shared lint baseline, the hooks and the CI checks run on these.
# Vendored (.github/shared-scripts: `mise-tools.toml .config/mise/conf.d/shared-tools.toml`); mise loads every *.toml of a project's
# .config/mise/conf.d before its own mise.toml, so a repository's own pin of the same tool wins and a tool only one repository needs stays in its mise.toml.
# One version per tool across the repositories: a repository that pins a tool of this file pins the same version (the repository's mise-tools check).
# Not here, on purpose: python, because the monorepo's devcontainer fixes its own minor; a repository that runs Python tasks pins it in its mise.toml.
[tools]
shellcheck = "0.11.0"
shfmt = "3.14.1"
"aqua:astral-sh/ruff" = "0.17.4"
"pipx:yamllint" = "1.38.0"
gitleaks = "8.30.1"
"aqua:crate-ci/typos" = "1.52.0"
"github:editorconfig-checker/editorconfig-checker" = { version = "4.0.2", asset_pattern = "editorconfig-checker-linux-amd64.tar.gz" }
actionlint = "1.7.12"
zizmor = "1.32.0"
yq = "4.54.3"
jq = "1.8.2"
uv = "0.13.7"
