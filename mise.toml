[tools]
yq = "4.54.3"
shellcheck = "0.11.0"
shfmt = "3.14.1"
"aqua:astral-sh/ruff" = "0.17.4"
"pipx:yamllint" = "1.38.0"
gitleaks = "8.30.1"
actionlint = "1.7.12"
zizmor = "1.32.0"
node = "24.22.2"
"npm:prettier" = "3.9.9"
"npm:renovate" = { version = "44.222.5", trust_policy_excludes = ["@yarnpkg/libzip@3.2.2"] }
gh = "2.102.1"
jq = "1.8.2"
uv = "0.13.7"
python = "3.13.18"
"pipx:pre-commit" = "4.6.0"

[settings]
lockfile = true

[hooks]
postinstall = "git config --unset-all core.hooksPath; pre-commit install"

[tasks."wt:gc"]
description = "Remove the worktrees and branches whose PR is merged and archive stale ones: mise run wt:gc [-- --dry-run]"
run = "shared/scripts/wt-gc"

[tasks."wt:list"]
description = "Show where every worktree stands"
run = "shared/scripts/wt-list"

[tasks."pr:wait"]
description = "Wait for a PR's required checks (or --run <id>) at 60 s polls: mise run pr:wait [<pr>|--run <id>]"
run = "shared/scripts/pr-wait.sh"
