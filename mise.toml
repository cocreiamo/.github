[tools]
yq = "4.54.2"
shellcheck = "0.11.0"
actionlint = "1.7.12"
zizmor = "1.32.0"
node = "24.22.2"
"npm:renovate" = { version = "44.221.4", trust_policy_excludes = ["@yarnpkg/libzip@3.2.2"] }
jq = "1.8.2"

[hooks]
postinstall = "git config core.hooksPath hooks"
enter = "git config core.hooksPath hooks"
